version: 2

# Grouped, weekly, and minor/patch only.
#
# The first version of this file excluded major bumps for next, react and
# react-dom by name, which missed the point: the problem is not those three
# packages, it is that a major bump is a piece of work rather than a merge.
# It opened twelve pull requests within the hour, ten of them majors —
# tailwind 3 to 4 (which moves the PostCSS plugin and fails the build),
# typescript 5 to 7, openai 1 to 3, anthropic 0 to 1, redis 5 to 8. One of
# them broke a Vercel preview deploy immediately.
#
# So majors are excluded as a class, per ecosystem, and are taken deliberately
# when someone has time to read a changelog. This does not weaken security
# coverage: `version-update:semver-major` scopes to version updates only, and
# Dependabot still opens security PRs for a vulnerable dependency at any
# severity — which is the thing the CI audit job blocks on anyway.
updates:
  - package-ecosystem: npm
    # The workspace root. The lockfile lives here, not in apps/web — assuming
    # otherwise has already broken CI once.
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One reviewable diff instead of a dozen. Individually these are noise;
      # together they get looked at.
      routine:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: "/apps/api"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      routine:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      routine:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
