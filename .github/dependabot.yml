version: 2

# Grouped and weekly on purpose. Fifty separate pull requests is not attention
# to security, it is a queue nobody reads — and an unread queue is where a real
# advisory goes to hide. Routine upgrades arrive as a handful of grouped PRs;
# security fixes are what the audit job blocks on, and those are read.
updates:
  - package-ecosystem: npm
    # The workspace root. The lockfile lives here, not in apps/web — assuming
    # otherwise has already broken CI once.
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Patch and minor together: individually they are noise, and reviewing
      # them as one diff is how they actually get looked at.
      routine:
        update-types:
          - minor
          - patch
    ignore:
      # Next and React move deliberately here, not automatically. This app is
      # on Next 16, whose conventions differ enough from earlier versions that
      # a major bump is a piece of work, not a merge.
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: "/apps/api"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      routine:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
